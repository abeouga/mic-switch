<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mic Switch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="titlebar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <img src="logo.svg" alt="" width="18" height="18">
      <span data-tauri-drag-region>Mic Switch</span>
    </div>
    <div class="win-btns">
      <button id="langBtn" class="tool" data-i18n-title="language" aria-haspopup="menu">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5M12 3.5C9.4 5.9 8.2 8.7 8.2 12s1.2 6.1 3.8 8.5"/></svg>
      </button>
      <button id="settingsBtn" class="tool" data-i18n-title="settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button id="minBtn" data-i18n-title="minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button id="closeBtn" class="close" data-i18n-title="hideToTray"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    </div>
  </header>

  <main>
    <nav class="segmented" id="tabs" data-tab="input">
      <span class="seg-thumb" aria-hidden="true"></span>
      <button data-tab="input">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span data-i18n="input"></span>
      </button>
      <button data-tab="output">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg><span data-i18n="output"></span>
      </button>
    </nav>

    <section class="hero glass" id="hero">
      <div class="hero-top">
        <button class="orb" id="muteBtn" data-i18n-title="toggleMute"></button>
        <div class="hero-text">
          <small id="heroLabel"></small>
          <h1 id="current" data-i18n="loading"></h1>
          <p id="currentSub"></p>
        </div>
      </div>
      <div class="vol">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/></svg>
        <input type="range" id="vol" min="0" max="100" value="0">
        <span id="volValue">0</span>
      </div>
    </section>

    <div class="section-title">
      <span id="listTitle"></span>
      <button id="refreshBtn" class="icon-btn" data-i18n-title="refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
    </div>
    <section id="list" class="list"></section>

  </main>

  <!-- 言語メニュー -->
  <div id="langMenu" class="menu" role="menu" hidden>
    <button role="menuitemradio" data-lang="auto"><span data-i18n="langAuto"></span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button role="menuitemradio" data-lang="ja"><span>日本語</span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button role="menuitemradio" data-lang="en"><span>English</span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  </div>

  <!-- 詳細設定 -->
  <div id="settingsSheet" class="sheet" aria-hidden="true">
    <div class="sheet-backdrop"></div>
    <section class="sheet-panel" role="dialog" aria-labelledby="settingsTitle">
      <header class="sheet-head">
        <b id="settingsTitle" data-i18n="settings"></b>
        <button id="settingsClose" class="icon-btn" data-i18n-title="close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
      </header>
      <div class="glass settings">
        <label class="row">
          <div><b data-i18n="autoSwitch"></b><small data-i18n="autoSwitchSub"></small></div>
          <input type="checkbox" id="autoSwitch" class="switch">
        </label>
        <label class="row">
          <div><b data-i18n="autostart"></b><small data-i18n="autostartSub"></small></div>
          <input type="checkbox" id="autostart" class="switch">
        </label>
      </div>
    </section>
  </div>

  <div id="toast" class="glass"></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
